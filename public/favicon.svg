<!-- Favicon SVG for modern browsers -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>
  
  <!-- Camera lens outer ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  
  <!-- Camera lens inner -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Lens center -->
  <circle cx="16" cy="16" r="3" fill="#64748b"/>
  <circle cx="16" cy="16" r="1.5" fill="#1e293b"/>
  
  <!-- Camera body highlight -->
  <rect x="6" y="12" width="4" height="8" rx="2" fill="#374151"/>
  
  <!-- Letter B -->
  <text x="26" y="20" font-family="serif" font-size="8" font-weight="bold" fill="#f8fafc">B</text>
</svg>